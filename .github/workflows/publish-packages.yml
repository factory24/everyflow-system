# Publish this repo's consumable packages on every push to main.
#
# Answers the question "can CI generate the packages instead of me importing
# files?" — yes, for both halves:
#
#   Go  → GitHub IS the module registry. There is no separate registry and
#         nothing to upload: a module version is just an annotated git TAG.
#         Consumers then `go get github.com/factory24/<repo>@vX.Y.Z`, which
#         removes every `replace ../<svc>` line.
#
#   TS  → the generated connect-es client is published to GitHub Packages (npm)
#         as `@factory24/<repo>-protos`, so the dashboard installs it instead of
#         running codegen and committing `lib/rpc/gen/**`.
#
# Private repos work for both: `go get` uses the GITHUB_TOKEN via a git
# insteadOf rule, npm uses the same token against npm.pkg.github.com.
name: publish-packages

on:
  push:
    branches: [main]
    # Skip doc-only pushes — they can't change a package.
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # create tags/releases
  packages: write # publish to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags to compute the next version

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # ── 1. Verify before tagging ─────────────────────────────────────────
      # A tag is immutable once consumers resolve it, so never publish a version
      # that doesn't build. -mod=vendor mirrors how the Docker images build.
      - name: Build and test
        env:
          GOPRIVATE: github.com/factory24/*
          GOFLAGS: -mod=mod
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          GOWORK=off go build ./...
          GOWORK=off go vet ./...
          GOWORK=off go test ./...

      # ── 2. Next semver from the latest tag ───────────────────────────────
      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "${{ github.event.inputs.bump || 'patch' }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac
          echo "version=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${major}.${minor}.${patch} (from ${latest})"

      # ── 3. Tag = the Go module release ───────────────────────────────────
      - name: Tag Go module
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "Release $V"
          git push origin "$V"
          echo "::notice::Go module published — consumers: go get ${{ github.repository }}@$V"

      # ── 4. TS/npm client, only when the repo actually has protos ─────────
      - name: Check for protos
        id: protos
        run: |
          if [ -d proto ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.protos.outputs.found == 'true'
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@factory24"

      - name: Generate + publish TS client
        if: steps.protos.outputs.found == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          PKG="@factory24/${GITHUB_REPOSITORY##*/}-protos"

          npm i -g @bufbuild/buf @bufbuild/protoc-gen-es@^2

          # connect-es TS from the same protos the Go client is generated from,
          # so the two can never drift.
          mkdir -p ts-gen
          cat > buf.gen.ts.yaml <<'YAML'
          version: v2
          plugins:
            - local: protoc-gen-es
              out: ts-gen
              opt: target=ts
          YAML
          buf generate --template buf.gen.ts.yaml

          cd ts-gen
          cat > package.json <<JSON
          {
            "name": "$PKG",
            "version": "${V#v}",
            "description": "Generated Connect/protobuf TypeScript client for ${GITHUB_REPOSITORY##*/}",
            "type": "module",
            "publishConfig": { "registry": "https://npm.pkg.github.com" },
            "repository": { "type": "git", "url": "git+https://github.com/${GITHUB_REPOSITORY}.git" },
            "peerDependencies": { "@bufbuild/protobuf": "^2" }
          }
          JSON
          npm publish
          echo "::notice::npm package published — $PKG@${V#v}"

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Published \`${{ steps.ver.outputs.version }}\`

          **Go module** (no registry needed — the tag *is* the release):
          \`\`\`
          go get github.com/${{ github.repository }}@${{ steps.ver.outputs.version }}
          \`\`\`
          Consumers need \`GOPRIVATE=github.com/factory24/*\` for a private repo.

          **npm package** (only if this repo has \`proto/\`):
          \`\`\`
          npm i @factory24/${{ github.event.repository.name }}-protos@${{ steps.ver.outputs.version }}
          \`\`\`
          EOF
